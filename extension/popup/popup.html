<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { width: 320px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 15px; }
    .header { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
    .header img { width: 24px; margin-right: 10px; }
    .header h2 { margin: 0; font-size: 16px; font-weight: 600; color: #00f0ff; }
    textarea { width: 100%; height: 80px; background: #111827; border: 1px solid #374151; color: #fff; padding: 8px; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; resize: none; font-size: 12px; }
    input[type="file"] { margin-bottom: 10px; font-size: 12px; }
    .btn { width: 100%; background: #00f0ff; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; margin-bottom: 5px; }
    .btn:hover { background: #00c0cc; }
    .btn-secondary { background: #374151; color: #fff; }
    .btn-secondary:hover { background: #4b5563; }
    #status { font-size: 12px; margin-top: 10px; text-align: center; color: #10b981; min-height: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../images/icon-32.png" alt="Logo">
    <h2>PhishSentinel Scanner</h2>
  </div>
  
  <textarea id="manualText" placeholder="Paste suspicious email text or links here..."></textarea>
  
  <label style="font-size: 12px; color: #9ca3af; display: block; margin-bottom: 5px;">Upload Suspicious QR Code:</label>
  <input type="file" id="qrUpload" accept="image/png, image/jpeg">
  
  <button id="scanBtn" class="btn">Analyze Manually</button>
  <button id="pageScanBtn" class="btn btn-secondary">Scan Current Page (Gmail)</button>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
